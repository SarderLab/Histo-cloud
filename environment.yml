name: test-tf2-env
channels:
  - conda-forge
  - nvidia
  - pytorch
  - anaconda
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - ca-certificates
  - openssl
  # Core scientific computing
  - numpy>=1.12.1
  - scipy>=0.19.0
  - matplotlib
  - scikit-image>=0.14.2
  - scikit-learn>=0.18.1
  - pandas>=0.19.2
  # Image processing libraries
  - pillow>=3.2.0
  - imageio>=2.3.0
  - imagecodecs
  - tifffile
  - openslide
  - openslide-python
  # GDAL and geospatial libraries (install via conda to avoid build issues)
  - gdal
  - libgdal
  - geos
  - proj
  - shapely
  # GUI libraries (if needed for visualization)
  - pyside6
  - qt6-main
  # System libraries
  - libpng
  - libjpeg-turbo
  - libtiff
  - libxml2
  - libxslt
  - pip:
      # TensorFlow 2.x requirements
      - tensorflow>=2.15.0,<3.0.0
      - tensorflow-addons>=0.22.0
      - tf-slim>=1.1.0
      # Core scientific packages
      - nimfa>=1.3.2
      - "opencv-python-headless<4.7"
      - sqlalchemy
      - pyvips
      - termcolor
      - openpyxl
      - "xlrd<2"
      # dask packages
      - "dask[dataframe]>=1.1.0"
      - distributed>=1.21.6
      # large image sources (without GDAL source to avoid conflicts)
      - large-image
      - large-image-source-tiff
      - large-image-source-pil
      - girder-slicer-cli-web
      - girder-client
      # cli
      - ctk-cli
      # Six for compatibility
      - six
